name: HuntReplay Studio
on:
  push:
    branches: [main, 'arena/**']
    paths: ['src/**', 'native/**', 'tests/**', 'tools/**', 'proto/*.proto', '*.props', '*.json', 'HuntReplayStudio.sln', '.github/workflows/studio.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/HuntReplay.Tests --configuration Release
      - run: python3 tools/CheckSource.py
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tools/ffmpeg.lock.json') }}
      - name: Build WGC / WASAPI engine and self-contained WPF executable
        shell: pwsh
        run: ./tools/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HuntReplayStudio-win-x64-unsigned-QA
          path: artifacts/publish/
          retention-days: 7
      # Hosted runners cannot validate a hardware encoder or a real interactive WGC / EAC session.
      # A green compilation job is NOT a GPU/anti-cheat certification; follow WINDOWS_VALIDATION.md.
